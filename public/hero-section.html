<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inspra.ai Hero Section</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, Manrope, Arial, sans-serif;
        color: #fff;
        background: #07172f;
      }

      .hero {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        padding: 120px 24px 72px;
        text-align: center;
        background:
          radial-gradient(circle at 50% 10%, rgba(108, 231, 215, 0.26), transparent 35%),
          radial-gradient(circle at 82% 58%, rgba(30, 58, 138, 0.36), transparent 34%),
          linear-gradient(180deg, #07172f 0%, #0f172a 72%, #000 100%);
      }

      .panel {
        max-width: 920px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 28px;
        padding: clamp(32px, 6vw, 56px);
        background: rgba(7, 23, 47, 0.58);
        box-shadow: 0 30px 120px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(22px);
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(40px, 7vw, 82px);
        line-height: 1.03;
        letter-spacing: 0;
      }

      p {
        max-width: 720px;
        margin: 0 auto 32px;
        color: rgba(255, 255, 255, 0.78);
        font-size: clamp(15px, 2vw, 18px);
        line-height: 1.75;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 16px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        border-radius: 999px;
        padding: 0 24px;
        color: inherit;
        text-decoration: none;
        font-weight: 700;
      }

      .primary {
        background: linear-gradient(135deg, #0c8c96, #6ce7d7);
        box-shadow: 0 18px 44px rgba(108, 231, 215, 0.24);
      }

      .secondary {
        background: #fff;
        color: #07172f;
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <section class="panel" aria-label="Hero section">
        <h1>Transform Your Business with AI Voice Agents</h1>
        <p>
          Inspra.ai helps businesses automate inbound and outbound calls, qualify leads,
          schedule appointments, and provide 24/7 customer support using intelligent AI
          voice agents.
        </p>
        <div class="actions">
          <a class="primary" href="/#contact">Book a Demo</a>
          <a class="secondary" href="/#services">Explore Solutions</a>
        </div>
      </section>
    </main>
  </body>
</html>
